image:
  repository: linuxserver/wireguard
  tag: 1.0.20250521-r0-ls90@sha256:394cc1146ad854096889548c60aab91aeff8017ed757d96eb4908a7dbe46856e
  pullPolicy: IfNotPresent

wg:
  # External IP or domain name for docker host. Used in server mode. If set to auto, the container will try to determine and set the external IP automatically
  serverUrl: auto

  # External port for docker host. Used in server mode.
  serverPort: 51820

  # Number of peers to create confs for. Required for server mode. Can also be a list of names: myPC,myPhone,myTablet (alphanumeric only), or a string array: ['myPC','myPhone','myTablet']
  # peers: []

  # DNS server set in peer/client configs (can be set as 8.8.8.8). Used in server mode. Defaults to auto, which uses wireguard docker host's DNS via included CoreDNS forward.
  # peerdns: auto

  # Internal subnet for the wireguard and server and peers (only change if it clashes). Used in server mode.
  # internalSubnet: 10.13.13.0

  # The IPs/Ranges that the peers will be able to reach using the VPN connection. If not specified the default value is: '0.0.0.0/0, ::0/0' This will cause ALL traffic to route through the VPN, if you want split tunneling, set this to only the IPs you would like to use the tunnel AND the ip of the server's WG ip, such as 10.13.13.1.
  # allowedIps: 0.0.0.0/0

  # Set to 'all' or a list of comma separated peers (ie. 1,4,laptop) or string array (['1', '4', 'laptop']) for the wireguard server to send keepalive packets to listed peers every 25 seconds. Useful if server is accessed via domain name and has dynamic IP. Used only in server mode.
  # persistentKeepAlivePeers: all

  # Generated QR codes will be displayed in the docker log. Set to false to skip log output.
  # logConfs: true

  killswitch: false
  excludedIP4networks: []
  excludedIP6networks: []

service:
  main:
    ports:
      main:
        protocol: udp

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
    PUID: 0
    capabilities:
      add:
        - NET_ADMIN
        - SYS_MODULE

  pod:
    fsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false

            readiness:
              enabled: false

            startup:
              enabled: false

          envFrom:
            - configMapRef:
                name: "wg-env-config"
